    // --- Sound Synthesis Helpers (Web Audio API) ---
    const playSuccessSound = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); // E5
        osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.2); // G5
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {
        console.warn('Audio not available:', e);
      }
    };

    const playErrorSound = () => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.setValueAtTime(180, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.35);
        osc.start();
        osc.stop(ctx.currentTime + 0.35);
      } catch (e) {
        console.warn('Audio error:', e);
      }
    };

    // --- Speech Synthesis (Web Speech API) ---
    const speakText = (text, langCode = 'yo-NG') => {
      if (!('speechSynthesis' in window)) {
        alert(`Pronunciation: "${text}"`);
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = langCode;
      utterance.rate = 0.88;
      
      const voices = window.speechSynthesis.getVoices();
      const match = voices.find(v => v.lang.startsWith(langCode.split('-')[0]));
      if (match) utterance.voice = match;

      window.speechSynthesis.speak(utterance);
    };

                        className={`flex flex-col items-center justify-center py-1 rounded-xl transition-all ${
                          activeTab === 'ai_tutor'
                            ? 'text-brand-400 font-bold bg-brand-500/10'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <span className="text-base">🤖</span>
                        <span className="text-[10px] mt-0.5">AI Tutor</span>
                      </button>

                      <button
                        onClick={() => setActiveTab('dialogue')}
                        className={`flex flex-col items-center justify-center py-1 rounded-xl transition-all ${
                          activeTab === 'dialogue'
                            ? 'text-brand-400 font-bold bg-brand-500/10'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <span className="text-base">💬</span>
                        <span className="text-[10px] mt-0.5">Dialogue</span>
                      </button>

                      <button
                        onClick={() => setActiveTab('profile')}
                        className={`flex flex-col items-center justify-center py-1 rounded-xl transition-all ${
                          activeTab === 'profile'
                            ? 'text-brand-400 font-bold bg-brand-500/10'
                            : 'text-slate-400 hover:text-slate-200'
                        }`}
                      >
                        <span className="text-base">👤</span>
                        <span className="text-[10px] mt-0.5">Profile</span>
                      </button>
                    </div>
                  </div>

                </div>
              </div>
            )}

            {/* VIEW 2: DEDICATED LANGUAGE SEO COURSE PAGE (/learn/yoruba, /learn/swahili, etc.) */}
            {currentView === 'learn_seo' && (
              <div className="space-y-8 py-4">
                <div className="bg-gradient-to-br from-cardBg to-[#0d1627] p-8 rounded-3xl border border-cardBorder shadow-xl relative overflow-hidden">
                  <div className="max-w-2xl">
                    <span className="px-3 py-1 rounded-full text-xs font-black bg-brand-500/20 text-brand-400 border border-brand-500/30 uppercase tracking-wider">
                      Comprehensive CEFR A1 - C2 Curriculum
                    </span>
                    <h1 className="text-3xl sm:text-4xl font-black font-heading mt-3 text-white">
                      Learn {currentLang.name} ({currentLang.nativeName}) Online
                    </h1>
                    <p className="text-slate-300 text-sm sm:text-base mt-2 leading-relaxed">
                      {currentLang.tagline}. Spoken by over <span className="font-bold text-brand-400">{currentLang.speakers}</span> people across Africa and the global diaspora.
                    </p>

                    <div className="mt-6 flex flex-wrap gap-3">
                      <button
                        onClick={() => navigateTo('app')}
                        className="px-6 py-3 rounded-xl bg-brand-500 text-slate-950 font-bold text-sm hover:bg-brand-400 transition-all shadow-lg shadow-brand-500/30 flex items-center gap-2"
                      >
                        <span>Start Learning {currentLang.name} Now</span>
                        <span>→</span>
                      </button>
                      <button
                        onClick={() => speakText(currentLang.greeting, currentLang.ttsCode)}
                        className="px-5 py-3 rounded-xl bg-slate-800 text-white font-bold text-sm border border-slate-700 hover:border-brand-500 transition-all flex items-center gap-2"
                      >
                        <span>Pronounce "{currentLang.greeting}"</span>
                        <span>🔊</span>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Educational Curriculum Pillars */}
                <div className="grid md:grid-cols-3 gap-6">
                  <div className="bg-cardBg p-6 rounded-2xl border border-cardBorder">
                    <div className="w-10 h-10 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center font-bold text-lg mb-4">
                      🎵
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">Tonal Accuracy & Pitch</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      {currentLang.toneGuide}. In tonal African languages, the same phonetic spelling carries vastly different meanings depending on pitch contour.
                    </p>
                  </div>

                  <div className="bg-cardBg p-6 rounded-2xl border border-cardBorder">
                    <div className="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-lg mb-4">
                      🤖
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">Contextual AI Tutor</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Powered by native language rules. Never outputs hallucinated or broken grammar. Tailored to your CEFR level from absolute beginner to fluent speaker.
                    </p>
                  </div>

                  <div className="bg-cardBg p-6 rounded-2xl border border-cardBorder">
                    <div className="w-10 h-10 rounded-xl bg-amber-500/20 text-amber-400 flex items-center justify-center font-bold text-lg mb-4">
                      🏛️
                    </div>
                    <h3 className="text-lg font-bold text-white mb-2">Cultural Etiquette & Honorifics</h3>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      Master the respect forms used with elders, traditional rulers, and ceremonial greetings like {currentLang.greeting}.
                    </p>
                  </div>
                </div>

                {/* Switch to other languages */}
                <div className="bg-slate-900/60 p-6 rounded-2xl border border-cardBorder">
                  <h3 className="text-base font-bold text-white mb-3">Explore other African languages:</h3>
                  <div className="flex flex-wrap gap-2">
                    {Object.values(LANGUAGES).map(lang => (
                      <button
                        key={lang.id}
                        onClick={() => navigateTo('learn_seo', lang.id)}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border ${
                          currentLanguageId === lang.id
                            ? 'bg-brand-500 text-slate-950 border-brand-500'
                            : 'bg-slate-800 text-slate-300 border-slate-700 hover:border-brand-500'
                        }`}
                      >
                        {lang.name} ({lang.nativeName})
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* VIEW 3: FAQ PAGE (/faq) */}
            {currentView === 'faq' && (
              <div className="max-w-3xl mx-auto space-y-6 py-4">
                <div className="text-center space-y-2">
                  <h1 className="text-3xl font-black font-heading text-white">Frequently Asked Questions</h1>
                  <p className="text-sm text-slate-400">Everything you need to know about Baobabble and our African language learning platform.</p>
                </div>

                <div className="space-y-4">
                  {[
                    {
                      q: 'Which African languages are supported?',
                      a: 'Baobabble currently offers full CEFR curricula (A1 to C2) for 7 major African languages: Yoruba, Igbo, Hausa, Amharic, Swahili, isiZulu, and Lingala.'
                    },
                    {
                      q: 'How does Baobabble handle tonal languages?',
                      a: 'Unlike generic language apps that ignore tones, Baobabble incorporates solfège musical pitch guides (High Mí, Mid Re, Low Dò), tonal diacritics, and native audio recognition to ensure you speak accurately.'
                    },
                    {
                      q: 'Is Baobabble free to use?',
                      a: 'Yes! The core learning loops, daily streak tracker, and introductory lessons are free. Learners earn XP and replenish hearts by completing daily reviews.'
                    },
                    {
                      q: 'Does Baobabble work on both desktop and mobile devices?',
                      a: 'Yes. Baobabble is fully responsive, works on iOS, Android, tablets, and desktop browsers, and can be installed as a PWA directly from your browser.'
                    }
                  ].map((faq, i) => (
                    <div key={i} className="bg-cardBg p-5 rounded-2xl border border-cardBorder">
                      <h3 className="text-base font-bold text-white mb-2">{faq.q}</h3>
                      <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">{faq.a}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW 4: PRIVACY POLICY (/privacy) */}
            {currentView === 'privacy' && (
              <div className="max-w-3xl mx-auto bg-cardBg p-8 rounded-3xl border border-cardBorder space-y-4 text-xs sm:text-sm text-slate-300 leading-relaxed py-8">
                <h1 className="text-2xl font-black font-heading text-white">Privacy Policy</h1>
                <p className="text-xs text-slate-400">Last updated: October 2026</p>
                <p>
                  At Baobabble, accessible from https://baobabble.polsia.io, one of our main priorities is the privacy of our global learners. This Privacy Policy document outlines the types of information collected and how we use it.
                </p>
                <h3 className="text-base font-bold text-white pt-2">Data We Collect</h3>
                <p>
                  We store learning progress (such as XP, streak count, completed lessons, and CEFR level) locally on your device (via browser localStorage) and securely in cloud-backed profiles when authenticated. We do not sell your personal data.
                </p>
                <h3 className="text-base font-bold text-white pt-2">Audio & Pronunciation</h3>
                <p>
                  Microphone input used during pronunciation practice is evaluated on-device through standard Web Speech APIs and is not recorded, stored, or distributed to third parties.
                </p>
              </div>
            )}

            {/* VIEW 5: TERMS OF SERVICE (/terms) */}
            {currentView === 'terms' && (
              <div className="max-w-3xl mx-auto bg-cardBg p-8 rounded-3xl border border-cardBorder space-y-4 text-xs sm:text-sm text-slate-300 leading-relaxed py-8">
                <h1 className="text-2xl font-black font-heading text-white">Terms of Service</h1>
                <p className="text-xs text-slate-400">Last updated: October 2026</p>
                <p>
                  By accessing or using the Baobabble website, mobile web app, or native applications, you agree to be bound by these Terms of Service.
                </p>
                <h3 className="text-base font-bold text-white pt-2">Educational Use</h3>
                <p>
                  Baobabble provides cultural and linguistic learning material for personal educational enrichment. All curricula, tonal exercises, and cultural insights are designed in partnership with native linguistic standards.
                </p>
              </div>
            )}

          </main>

          {/* INTERACTIVE QUIZ MODAL */}
          {activeQuiz && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#111827] border border-slate-700 max-w-md w-full rounded-3xl overflow-hidden shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                
                {/* Modal Header */}
                <div className="bg-slate-800/80 px-5 py-3 flex items-center justify-between border-b border-slate-700">
                  <div className="flex items-center gap-2">
                    <span className="text-xs font-bold text-brand-400">Lesson Quiz</span>
                    <span className="text-xs text-slate-400">• {activeQuiz.title}</span>
                  </div>
                  <button
                    onClick={() => setActiveQuiz(null)}
                    className="text-slate-400 hover:text-white text-lg font-bold"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-5">
                  {!quizCompleted ? (
                    <div>
                      {/* Question Progress bar */}
                      <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden mb-4">
                        <div 
                          className="bg-brand-500 h-full transition-all duration-300"
                          style={{ width: `${((currentQuestionIndex + 1) / activeQuiz.questions.length) * 100}%` }}
                        ></div>
                      </div>

                      <span className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                        Question {currentQuestionIndex + 1} of {activeQuiz.questions.length}
                      </span>
                      
                      <h3 className="text-base font-bold text-white mt-1 mb-4">
                        {activeQuiz.questions[currentQuestionIndex].prompt}
                      </h3>

                      {/* Options */}
                      <div className="space-y-2 mb-5">
                        {activeQuiz.questions[currentQuestionIndex].options.map((option, idx) => {
                          const isSelected = selectedOption === idx;
                          let btnStyle = 'bg-slate-800/80 border-slate-700 text-slate-200 hover:border-slate-500';

                          if (isAnswerSubmitted) {
                            if (idx === activeQuiz.questions[currentQuestionIndex].correctIndex) {
                              btnStyle = 'bg-emerald-500/20 border-emerald-500 text-brand-300 font-bold';
                            } else if (isSelected) {
                              btnStyle = 'bg-rose-500/20 border-rose-500 text-rose-300 font-bold';
                            }
                          } else if (isSelected) {
                            btnStyle = 'bg-brand-500/20 border-brand-500 text-brand-300 font-bold';
                          }

                          return (
                            <button
                              key={idx}
                              onClick={() => handleOptionSelect(idx)}
                              disabled={isAnswerSubmitted}
                              className={`w-full p-3.5 rounded-xl border text-xs sm:text-sm text-left transition-all flex items-center justify-between ${btnStyle}`}
                            >
                              <span>{option}</span>
                              {isAnswerSubmitted && idx === activeQuiz.questions[currentQuestionIndex].correctIndex && (
                                <span className="text-emerald-400 font-bold">✓</span>
                              )}
                              {isAnswerSubmitted && isSelected && idx !== activeQuiz.questions[currentQuestionIndex].correctIndex && (
                                <span className="text-rose-400 font-bold">✕</span>
                              )}
                            </button>
                          );
                        })}
                      </div>

                      {/* Feedback Explanation */}
                      {isAnswerSubmitted && (
                        <div className={`p-3.5 rounded-xl text-xs mb-4 border ${
                          isAnswerCorrect
                            ? 'bg-emerald-950/40 border-emerald-500/50 text-emerald-200'
                            : 'bg-rose-950/40 border-rose-500/50 text-rose-200'
                        }`}>
                          <p className="font-bold mb-1">
                            {isAnswerCorrect ? '🎉 Correct!' : '❌ Not quite right'}
                          </p>
                          <p>{activeQuiz.questions[currentQuestionIndex].explanation}</p>
                        </div>
                      )}

                      {/* Action buttons */}
                      <div className="flex gap-2">
                        {!isAnswerSubmitted ? (
                          <button
                            onClick={submitAnswer}
                            disabled={selectedOption === null}
                            className="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-400 disabled:opacity-50 text-slate-950 font-bold text-xs sm:text-sm transition-all"
                          >
                            Check Answer
                          </button>
                        ) : (
                          <button
                            onClick={nextQuestion}
                            className="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-xs sm:text-sm transition-all"
                          >
                            {currentQuestionIndex + 1 < activeQuiz.questions.length ? 'Next Question →' : 'Complete Lesson! 🏆'}
                          </button>
                        )}
                      </div>
                    </div>
                  ) : (
                    /* Lesson Completed Screen */
                    <div className="text-center py-6 space-y-4">
                      <div className="w-20 h-20 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/40 flex items-center justify-center text-4xl mx-auto shadow-xl shadow-brand-500/20">
                        🎉
                      </div>
                      <h3 className="text-xl font-black text-white">Lesson Completed!</h3>
                      <p className="text-xs text-slate-300">
                        You gained <span className="text-amber-400 font-bold">+15 XP</span> and strengthened your African language fluency!
                      </p>
                      <button
                        onClick={() => setActiveQuiz(null)}
                        className="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-400 text-slate-950 font-bold text-sm transition-all"
                      >
                        Continue to Dashboard
                      </button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Universal Footer with all 11 Required Links */}
          <footer className="border-t border-cardBorder bg-[#0c1220] py-8 px-4 text-xs text-slate-400 mt-12">
            <div className="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
              
              <div className="flex items-center gap-3">
                <span className="text-2xl">🌳</span>
                <div>
                  <span className="text-sm font-bold text-white">Baobabble</span>
                  <p className="text-[11px] text-slate-500">Master 7 African Languages with Native AI Tutors.</p>
                </div>
              </div>

              {/* 11 Pages Links for Crawlers and Users */}
              <div className="flex flex-wrap items-center justify-center gap-x-4 gap-y-2 text-xs">
                <button onClick={() => navigateTo('app')} className="hover:text-brand-400 transition-colors">Home</button>
                <button onClick={() => navigateTo('learn_seo', 'yoruba')} className="hover:text-brand-400 transition-colors">Yoruba</button>
                <button onClick={() => navigateTo('learn_seo', 'igbo')} className="hover:text-brand-400 transition-colors">Igbo</button>
                <button onClick={() => navigateTo('learn_seo', 'hausa')} className="hover:text-brand-400 transition-colors">Hausa</button>
                <button onClick={() => navigateTo('learn_seo', 'amharic')} className="hover:text-brand-400 transition-colors">Amharic</button>
                <button onClick={() => navigateTo('learn_seo', 'swahili')} className="hover:text-brand-400 transition-colors">Swahili</button>
                <button onClick={() => navigateTo('learn_seo', 'zulu')} className="hover:text-brand-400 transition-colors">isiZulu</button>
                <button onClick={() => navigateTo('learn_seo', 'lingala')} className="hover:text-brand-400 transition-colors">Lingala</button>
                <button onClick={() => navigateTo('privacy')} className="hover:text-brand-400 transition-colors">Privacy</button>
                <button onClick={() => navigateTo('terms')} className="hover:text-brand-400 transition-colors">Terms</button>
                <button onClick={() => navigateTo('faq')} className="hover:text-brand-400 transition-colors">FAQ</button>
              </div>

              <div className="text-[11px] text-slate-500">
                © {new Date().getFullYear()} Baobabble. All rights reserved.
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
